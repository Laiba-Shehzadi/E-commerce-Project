<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MyShop</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #cbd5e1;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .login-container {
            width: 420px;
          background-color:  #dbeafe;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .logo {
            text-align: center;

            font-size: 30px;
            font-weight: bold;

            color: #0d6efd;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        h2 {
            text-align: center;

            color: #222;

            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #0d6efd;

            box-shadow:
                0 0 0 3px rgba(13, 110, 253, 0.1);
        }

        .errorlist {
            list-style: none;

            padding: 0;

            margin: 5px 0;

            color: #dc3545;

            font-size: 13px;
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            margin-top: 10px;

            border: none;

            border-radius: 8px;

            background: #0d6efd;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            background: #084298;

            transform: translateY(-2px);
        }

        .register-text {
            text-align: center;

            margin-top: 25px;

            color: #666;
        }

        .register-text a {
            color: #0d6efd;

            text-decoration: none;

            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #555;

            text-decoration: none;

            font-size: 14px;
        }

        .back-home:hover {
            color: #0d6efd;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">
        🛍️ MyShop
    </div>

    <p class="subtitle">
        Welcome back! Login to continue shopping
    </p>

    <h2>Login</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}

            <p>

                {{ field.label_tag }}

                {{ field }}

                {% for error in field.errors %}

                    <span style="color: #dc3545; font-size: 13px;">
                        {{ error }}
                    </span>

                {% endfor %}

            </p>

        {% endfor %}

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="register-text">

        Don't have an account?

        <a href="{% url 'register' %}">
            Create Account
        </a>

    </div>

    <a href="{% url 'product_list' %}" class="back-home">
        ← Back to Products
    </a>

</div>

</body>

</html>
